name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_CONFIG_IGNORE_SCRIPTS: "true"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    # Required for npm trusted publishing (OIDC)
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    # Skip if commit is from changesets (avoid infinite loop)
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Fetch all history for proper versioning
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.3" # Includes npm trusted publishing support
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: |
          npm config get ignore-scripts
          test "$(npm config get ignore-scripts)" = true
          npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2, Changesets CLI 3 output
        with:
          version-script: npm run version-packages
          publish-script: npm exec --no --ignore-scripts -- changeset publish
          pr-title: "Version Packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ''  # Empty string forces OIDC authentication

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const publishedPackages = ${{ steps.changesets.outputs['published-packages'] }};
            
            if (publishedPackages && publishedPackages.length > 0) {
              // Use the first package's version for the release tag (they're all the same with fixed versioning)
              const version = publishedPackages[0].version;
              const tagName = `v${version}`;
              
              // Build release notes from published packages
              const packageList = publishedPackages
                .map(pkg => `- ${pkg.name}@${pkg.version}`)
                .join('\n');
              
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name: tagName,
                body: `## Published Packages\n\n${packageList}\n\nSee the [CHANGELOG](./packages/client/CHANGELOG.md) for details.`,
                draft: false,
                prerelease: false
              });
            }
